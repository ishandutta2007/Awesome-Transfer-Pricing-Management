<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19" />
      <stop offset="45%" stop-color="#111c38" />
      <stop offset="80%" stop-color="#0f2b46" />
      <stop offset="100%" stop-color="#061224" />
    </linearGradient>

    <!-- Glowing Accent Gradient -->
    <linearGradient id="accent-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8">
        <animate attributeName="stop-color" values="#38bdf8;#818cf8;#34d399;#38bdf8" dur="8s" repeatCount="indefinite" />
      </stop>
      <stop offset="50%" stop-color="#818cf8">
        <animate attributeName="stop-color" values="#818cf8;#ec4899;#38bdf8;#818cf8" dur="8s" repeatCount="indefinite" />
      </stop>
      <stop offset="100%" stop-color="#34d399">
        <animate attributeName="stop-color" values="#34d399;#38bdf8;#818cf8;#34d399" dur="8s" repeatCount="indefinite" />
      </stop>
    </linearGradient>

    <!-- Text Shimmer Gradient -->
    <linearGradient id="text-shimmer" x1="0%" y1="0%" x2="200%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="30%" stop-color="#ffffff" />
      <stop offset="50%" stop-color="#38bdf8" />
      <stop offset="70%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#ffffff" />
      <animate attributeName="x1" from="-100%" to="100%" dur="5s" repeatCount="indefinite" />
      <animate attributeName="x2" from="100%" to="300%" dur="5s" repeatCount="indefinite" />
    </linearGradient>

    <!-- Card Background Gradient -->
    <linearGradient id="card-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="rgba(255, 255, 255, 0.08)" />
      <stop offset="100%" stop-color="rgba(255, 255, 255, 0.02)" />
    </linearGradient>

    <!-- Grid Pattern -->
    <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="rgba(255, 255, 255, 0.04)" stroke-width="1" />
    </pattern>

    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    .title {
      font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, sans-serif;
      font-weight: 800;
      font-size: 42px;
      letter-spacing: -0.5px;
    }
    .subtitle {
      font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, sans-serif;
      font-weight: 400;
      font-size: 16px;
      fill: #94a3b8;
    }
    .badge-text {
      font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, sans-serif;
      font-weight: 600;
      font-size: 13px;
      fill: #e2e8f0;
    }
    .stat-number {
      font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, sans-serif;
      font-weight: 700;
      font-size: 18px;
      fill: #38bdf8;
    }
    .stat-label {
      font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, sans-serif;
      font-weight: 500;
      font-size: 11px;
      fill: #64748b;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
  </style>

  <!-- Background Base -->
  <rect width="1200" height="360" rx="16" fill="url(#bg-grad)" />
  <rect width="1200" height="360" rx="16" fill="url(#grid)" />

  <!-- Animated Ambient Glow Blobs -->
  <circle cx="150" cy="80" r="140" fill="#38bdf8" opacity="0.12" filter="url(#glow)">
    <animate attributeName="cy" values="80;120;80" dur="10s" repeatCount="indefinite" />
    <animate attributeName="cx" values="150;180;150" dur="12s" repeatCount="indefinite" />
  </circle>
  <circle cx="1050" cy="280" r="160" fill="#818cf8" opacity="0.15" filter="url(#glow)">
    <animate attributeName="cy" values="280;240;280" dur="9s" repeatCount="indefinite" />
  </circle>
  <circle cx="900" cy="90" r="120" fill="#34d399" opacity="0.1" filter="url(#glow)">
    <animate attributeName="cx" values="900;860;900" dur="11s" repeatCount="indefinite" />
  </circle>

  <!-- Decorative Border Top Accent Line -->
  <rect x="0" y="0" width="1200" height="4" fill="url(#accent-grad)" rx="2" />

  <!-- Left Side Icon: Intercompany Nodes & Transactions -->
  <g transform="translate(70, 75)">
    <!-- Central Hexagon / Hub -->
    <polygon points="60,20 100,43 100,90 60,113 20,90 20,43" fill="url(#card-grad)" stroke="url(#accent-grad)" stroke-width="2" />
    <text x="60" y="73" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="24" fill="#38bdf8">⚖️</text>

    <!-- Connected Subsidiary Nodes -->
    <line x1="20" y1="43" x2="-15" y2="10" stroke="#38bdf8" stroke-width="2" stroke-dasharray="4,4" opacity="0.7">
      <animate attributeName="stroke-dashoffset" from="0" to="16" dur="2s" repeatCount="indefinite" />
    </line>
    <circle cx="-15" cy="10" r="16" fill="#1e293b" stroke="#38bdf8" stroke-width="2" />
    <text x="-15" y="15" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#e2e8f0">HQ</text>

    <line x1="100" y1="43" x2="135" y2="10" stroke="#818cf8" stroke-width="2" stroke-dasharray="4,4" opacity="0.7">
      <animate attributeName="stroke-dashoffset" from="16" to="0" dur="2s" repeatCount="indefinite" />
    </line>
    <circle cx="135" cy="10" r="16" fill="#1e293b" stroke="#818cf8" stroke-width="2" />
    <text x="135" y="15" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#e2e8f0">EU</text>

    <line x1="60" y1="113" x2="60" y2="155" stroke="#34d399" stroke-width="2" stroke-dasharray="4,4" opacity="0.7">
      <animate attributeName="stroke-dashoffset" from="0" to="16" dur="2s" repeatCount="indefinite" />
    </line>
    <circle cx="60" cy="155" r="16" fill="#1e293b" stroke="#34d399" stroke-width="2" />
    <text x="60" y="160" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#e2e8f0">APAC</text>

    <line x1="20" y1="90" x2="-20" y2="125" stroke="#ec4899" stroke-width="2" stroke-dasharray="4,4" opacity="0.7">
      <animate attributeName="stroke-dashoffset" from="16" to="0" dur="2s" repeatCount="indefinite" />
    </line>
    <circle cx="-20" cy="125" r="16" fill="#1e293b" stroke="#ec4899" stroke-width="2" />
    <text x="-20" y="130" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#e2e8f0">US</text>
  </g>

  <!-- Central Content Area -->
  <g transform="translate(260, 60)">
    <!-- Category Pill Badge -->
    <rect x="0" y="0" width="260" height="28" rx="14" fill="rgba(56, 189, 248, 0.12)" stroke="rgba(56, 189, 248, 0.3)" stroke-width="1" />
    <circle cx="14" cy="14" r="5" fill="#38bdf8" />
    <text x="28" y="19" class="badge-text" fill="#38bdf8">🌐 GLOBAL TAX TECH ECOSYSTEM</text>

    <!-- Main Title -->
    <text x="0" y="75" class="title" fill="url(#text-shimmer)">Awesome Transfer Pricing</text>
    <text x="540" y="75" class="title" fill="url(#accent-grad)">Management</text>

    <!-- Subtitle / Tagline -->
    <text x="0" y="112" class="subtitle">
      Curated directory of enterprise SaaS suites, operational TP engines, OECD/BEPS compliance,
    </text>
    <text x="0" y="136" class="subtitle">
      CbCR analytics, arm's-length benchmarking databases, and open-source financial tools.
    </text>

    <!-- Feature Cards Row -->
    <g transform="translate(0, 165)">
      <!-- Card 1: OECD/BEPS -->
      <rect x="0" y="0" width="180" height="65" rx="10" fill="url(#card-grad)" stroke="rgba(255,255,255,0.08)" stroke-width="1" />
      <text x="16" y="28" class="stat-number">OECD BEPS</text>
      <text x="16" y="48" class="stat-label">Pillar 1, 2 &amp; CbCR</text>

      <!-- Card 2: Intercompany Pricing -->
      <rect x="195" y="0" width="180" height="65" rx="10" fill="url(#card-grad)" stroke="rgba(255,255,255,0.08)" stroke-width="1" />
      <text x="211" y="28" class="stat-number">Operational TP</text>
      <text x="211" y="48" class="stat-label">Intercompany Ledger</text>

      <!-- Card 3: Benchmarking -->
      <rect x="390" y="0" width="180" height="65" rx="10" fill="url(#card-grad)" stroke="rgba(255,255,255,0.08)" stroke-width="1" />
      <text x="406" y="28" class="stat-number">Arm's Length</text>
      <text x="406" y="48" class="stat-label">Economic Benchmarks</text>

      <!-- Card 4: Open Source -->
      <rect x="585" y="0" width="180" height="65" rx="10" fill="url(#card-grad)" stroke="rgba(255,255,255,0.08)" stroke-width="1" />
      <text x="601" y="28" class="stat-number">Open Source</text>
      <text x="601" y="48" class="stat-label">ETL &amp; Python / R</text>
    </g>
  </g>

  <!-- Bottom Dynamic Wave Accent -->
  <path d="M 0 350 Q 300 335, 600 350 T 1200 350 L 1200 360 L 0 360 Z" fill="url(#accent-grad)" opacity="0.3">
    <animate attributeName="d" 
      values="M 0 350 Q 300 335, 600 350 T 1200 350 L 1200 360 L 0 360 Z;
              M 0 352 Q 300 360, 600 345 T 1200 352 L 1200 360 L 0 360 Z;
              M 0 350 Q 300 335, 600 350 T 1200 350 L 1200 360 L 0 360 Z" 
      dur="6s" repeatCount="indefinite" />
  </path>
</svg>
